name: Build and Publish Devcontainer

on:
  push:
    branches: [ main ]
    paths:
      - 'devcontainer/**'
      - 'pyproject.toml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-publish:
    name: Build and publish devcontainer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: devcontainer/Containerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/blockchain-devcontainer:latest
            ghcr.io/${{ github.repository_owner }}/blockchain-devcontainer:${{ github.sha }}
